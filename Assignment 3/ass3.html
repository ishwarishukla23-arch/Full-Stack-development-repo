<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOGUE | Minimal Fashion Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Section */
        :root {
            --bg-color: #ffffff;
            --accent-color: #000000;
            --text-muted: #6c757d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--accent-color);
            scroll-behavior: smooth;
        }

        /* Navbar Styling */
        .navbar {
            letter-spacing: 1px;
            padding: 20px 0;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        /* Hero Section */
        .hero {
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #f8f8f8;
            margin-bottom: 50px;
        }

        .hero h1 {
            font-weight: 700;
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* Product Cards */
        .card {
            border: none;
            border-radius: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card-img-top {
            border-radius: 0;
            height: 400px;
            object-fit: cover;
            background-color: #f1f1f1;
        }

        .btn-buy {
            background-color: var(--accent-color);
            color: white;
            border-radius: 0;
            padding: 10px 20px;
            font-size: 0.8rem;
            width: 100%;
            border: 1px solid var(--accent-color);
        }

        .btn-buy:hover {
            background-color: white;
            color: black;
        }

        /* Badge Styling */
        #cart-count {
            font-size: 0.7rem;
            vertical-align: top;
        }

        footer {
            margin-top: 100px;
            padding: 50px 0;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top bg-white">
        <div class="container">
            <a class="navbar-brand" href="#">VOGUE.</a>
            <div class="ms-auto d-flex align-items-center">
                <a href="#" class="nav-link me-4 d-none d-md-block">COLLECTION</a>
                <a href="#" class="nav-link me-4 d-none d-md-block">ABOUT</a>
                <button class="btn btn-outline-dark position-relative border-0" onclick="alert('Checkout functional soon!')">
                    BAG (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container" data-aos="fade-up">
            <h1 class="display-1">LESS IS MORE</h1>
            <p class="lead text-muted">The 2026 Minimalist Summer Drop is here.</p>
            <a href="#shop" class="btn btn-dark px-5 py-3 mt-4">SHOP COLLECTION</a>
        </div>
    </header>

    <section id="shop" class="container">
        <div class="row g-5" id="product-list">
            </div>
    </section>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1 fw-bold">VOGUE. CLOTHING</p>
            <p class="text-muted small">© 2026 Crafted for Elegance.</p>
        </div>
    </footer>

    <script>
        // 1. Product Data Array
        const products = [
            { id: 1, name: "Oversized Tee", price: "$35.00", img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600" },
            { id: 2, name: "Linen Blazer", price: "$145.00", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600" },
            { id: 3, name: "Structured Tote", price: "$85.00", img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600" },
            { id: 4, name: "Tailored Pants", price: "$95.00", img: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=600" }
        ];

        let count = 0;
        const cartDisplay = document.getElementById('cart-count');
        const productList = document.getElementById('product-list');

        // 2. Function to generate UI
        function loadProducts() {
            products.map(item => {
                const card = `
                    <div class="col-md-3 col-6">
                        <div class="card h-100">
                            <img src="${item.img}" class="card-img-top" alt="${item.name}">
                            <div class="card-body px-0">
                                <h6 class="mb-1">${item.name}</h6>
                                <p class="text-muted small">${item.price}</p>
                                <button onclick="addToCart(this)" class="btn btn-buy">ADD TO BAG</button>
                            </div>
                        </div>
                    </div>
                `;
                productList.innerHTML += card;
            });
        }

        // 3. Simple Add to Cart function
        function addToCart(button) {
            count++;
            cartDisplay.innerText = count;
            
            // Interaction feedback
            const originalText = button.innerText;
            button.innerText = "ADDED ✔";
            button.style.backgroundColor = "#28a745";
            button.style.borderColor = "#28a745";

            setTimeout(() => {
                button.innerText = originalText;
                button.style.backgroundColor = "black";
                button.style.borderColor = "black";
            }, 800);
        }

        // Initialize on load
        window.onload = loadProducts;
    </script>

</body>
</html>
