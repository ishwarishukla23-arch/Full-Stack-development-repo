<!DOCTYPE html>
<html>
<head>
<title>HTML Text Formatting Tags</title>

<style>
body{
    font-family: Arial;
}

table{
    border: 1px solid black;
}

th, td{
    border: 1px solid black;
    padding: 5px;
}

th{
    background-color: lightgray;
}
</style>

</head>

<body>

<h1>HTML Text Formatting Tags</h1>

<table>

<tr>
<th>Tag</th>
<th>Description</th>
<th>Example</th>
</tr>

<tr>
<td>&lt;b&gt;</td>
<td>Bold text</td>
<td><b>Bold Text</b></td>
</tr>

<tr>
<td>&lt;i&gt;</td>
<td>Italic text</td>
<td><i>Italic Text</i></td>
</tr>

<tr>
<td>&lt;u&gt;</td>
<td>Underline text</td>
<td><u>Underlined Text</u></td>
</tr>

<tr>
<td>&lt;mark&gt;</td>
<td>Highlighted text</td>
<td><mark>Highlighted</mark></td>
</tr>

<tr>
<td>&lt;small&gt;</td>
<td>Small text</td>
<td><small>Small Text</small></td>
</tr>

<tr>
<td>&lt;del&gt;</td>
<td>Deleted text</td>
<td><del>Deleted Text</del></td>
</tr>

<tr>
<td>&lt;sub&gt;</td>
<td>Subscript</td>
<td>H<sub>2</sub>O</td>
</tr>

<tr>
<td>&lt;sup&gt;</td>
<td>Superscript</td>
<td>X<sup>2</sup></td>
</tr>

</table>

</body>
</html>
